name: CI

on:
  # Local validation/builds are the default; cloud runs require an explicit manual dispatch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui -- --reporter=line
      - run: npm run test:e2e -- --reporter=line

  windows-desktop:
    name: Windows desktop checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run typecheck
      - run: npm test -- tests/desktop-runtime.test.ts tests/local-setup.test.ts tests/windows-execution.test.ts tests/windows-private-path.test.ts tests/windows-terminal.test.ts --maxWorkers=1
      - run: npm audit --omit=dev
      - run: npm audit --prefix desktop
      - run: npm run desktop:build
      - run: node scripts/desktop-smoke.mjs
      # The account service is private; the full signed-in lifecycle runs locally (see docs/desktop.md).
      - run: node scripts/desktop-window-smoke.mjs --gate-only
        timeout-minutes: 5
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-desktop-verification
          path: release/verification/
          retention-days: 14
